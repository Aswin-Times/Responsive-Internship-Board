# Render Blueprint: deploys this repo as a static site (no build step).
services:
  - type: web
    name: responsive-internship-board
    runtime: static
    buildCommand: echo "Static site - no build step"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
