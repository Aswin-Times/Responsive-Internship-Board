<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse and filter internship openings by keyword and domain.">
  <title>Internship Board</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#results">Skip to internship listings</a>

  <header class="site-header">
    <div class="container">
      <h1>Internship Board</h1>
      <p class="tagline">Find an internship that fits your skills.</p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-labelledby="filters-heading">
      <h2 id="filters-heading" class="visually-hidden">Search and filter</h2>
      <!-- Search and domain filters are added in step 2 -->
    </section>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading" class="results-heading">Open internships</h2>
      <ul id="results" class="card-grid" tabindex="-1"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>All listings are fictional sample data. Built with HTML, CSS and vanilla JavaScript.</p>
    </div>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
